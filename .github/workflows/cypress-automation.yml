name: Cypress Full Stack QA Pipeline (WEB E2E + API REST + PACT/OpenAPI)

on:
  push:
    branches: [master, main, TestingApi]
  pull_request:
    branches: [master, main]
  workflow_dispatch: # Permite execução manual pela interface do GitHub

jobs:
  cypress-qa-suite:
    name: Run Cypress BDD Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WEB_BASE_URL: https://front.serverest.dev
      API_BASE_URL: https://serverest.dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Start ServeRest Local API Server
        run: |
          npx serverest &
          npx wait-on http://localhost:3000 -t 30000

      - name: Run API REST & Contract Suite (Ajv / OpenAPI)
        run: npm run cy:run:api
        env:
          API_BASE_URL: http://localhost:3000

      - name: Run WEB E2E Suite (Pure Browser / DOM)
        run: npm run cy:run:web

      - name: Generate Unified Mochawesome HTML Report
        if: always()
        run: npm run report:merge

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-html-report
          path: cypress/reports/html
          retention-days: 14
